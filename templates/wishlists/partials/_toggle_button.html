{# The wishlist toggle control. The signed-in button is an HTMX swap that re-renders this partial. #}
{% if user.is_authenticated %}
  {% if in_wishlist %}
    <button
      hx-post="{% url 'wishlists:toggle' product.pk %}"
      hx-swap="outerHTML"
      class="btn btn-secondary btn-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      In Wishlist (Remove)
    </button>
  {% else %}
    <button
      hx-post="{% url 'wishlists:toggle' product.pk %}"
      hx-swap="outerHTML"
      class="btn btn-outline btn-secondary btn-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
      </svg>
      Add to Wishlist
    </button>
  {% endif %}
{% else %}
  {# Anonymous visitors are prompted to sign in — a plain link, no HTMX. #}
  <a href="{% url 'accounts:login' %}?next={{ request.get_full_path|urlencode }}"
     class="btn btn-outline btn-secondary btn-sm">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364 0z" />
    </svg>
    Add to Wishlist
  </a>
{% endif %}
